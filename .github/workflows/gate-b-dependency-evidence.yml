name: Gate B dependency evidence

on:
  pull_request:
    branches: [main]
    paths:
      - "requirements.txt"
      - "requirements-dev.txt"
      - "requirements-lock/**"
      - "tools/dependency_evidence.py"
      - ".github/workflows/gate-b-dependency-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-b-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-cp313:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event commit without third-party actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Resolve exact Linux CPython 3.13 artifacts without installation
        shell: bash
        run: |
          set -euo pipefail
          PYTHON="$(find /opt/hostedtoolcache/Python -path '*/3.13.*/*/bin/python' -type f 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "${PYTHON}" ]; then
            echo "CPython 3.13 was not found in the hosted runner toolcache" >&2
            exit 3
          fi
          "${PYTHON}" --version
          "${PYTHON}" -m pip --version
          "${PYTHON}" -m pip install --disable-pip-version-check --no-input --dry-run --ignore-installed --report gate-b-linux-cp313.json -r requirements-dev.txt
          "${PYTHON}" tools/dependency_evidence.py gate-b-linux-cp313.json --platform-label linux-x64-cp313 --lock-output gate-b-linux-cp313.lock.txt

  windows-cp313:
    runs-on: windows-2025
    steps:
      - name: Checkout exact event commit without third-party actions
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git init .
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin $env:GITHUB_SHA
          git checkout --detach FETCH_HEAD

      - name: Resolve exact Windows CPython 3.13 artifacts without installation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $python = Get-ChildItem "C:\hostedtoolcache\windows\Python\3.13.*\x64\python.exe" -ErrorAction SilentlyContinue | Sort-Object FullName | Select-Object -Last 1
          if (-not $python) {
            throw "CPython 3.13 was not found in the hosted runner toolcache"
          }
          & $python.FullName --version
          & $python.FullName -m pip --version
          & $python.FullName -m pip install --disable-pip-version-check --no-input --dry-run --ignore-installed --report gate-b-windows-cp313.json -r requirements-dev.txt
          & $python.FullName tools/dependency_evidence.py gate-b-windows-cp313.json --platform-label windows-x64-cp313 --lock-output gate-b-windows-cp313.lock.txt
