name: Gate B dependency evidence

on:
  pull_request:
    branches: [main]
    paths:
      - "requirements.txt"
      - "requirements-dev.txt"
      - "requirements-lock/**"
      - "tools/dependency_evidence.py"
      - ".github/workflows/gate-b-dependency-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-b-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-cp313:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event commit without checkout action
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Provision CPython 3.13 from pinned GitHub-owned action
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Resolve exact Linux CPython 3.13 artifacts without installation
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python -m pip --version
          python -m pip install --disable-pip-version-check --no-input --dry-run --ignore-installed --report gate-b-linux-cp313.json -r requirements-dev.txt
          python tools/dependency_evidence.py gate-b-linux-cp313.json --platform-label linux-x64-cp313 --lock-output gate-b-linux-cp313.lock.txt

  windows-cp313:
    runs-on: windows-2025
    steps:
      - name: Checkout exact event commit without checkout action
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git init .
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin $env:GITHUB_SHA
          git checkout --detach FETCH_HEAD

      - name: Provision CPython 3.13 from pinned GitHub-owned action
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Resolve exact Windows CPython 3.13 artifacts without installation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python --version
          python -m pip --version
          python -m pip install --disable-pip-version-check --no-input --dry-run --ignore-installed --report gate-b-windows-cp313.json -r requirements-dev.txt
          python tools/dependency_evidence.py gate-b-windows-cp313.json --platform-label windows-x64-cp313 --lock-output gate-b-windows-cp313.lock.txt
